name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py
      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh
      - name: Check schema helper syntax
        if: steps.changes.outputs.heavy == 'true'
        run: python3 -m py_compile prepend.py match.py shift.py
      - name: Validate DBML
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Export schema to PostgreSQL SQL
        if: steps.changes.outputs.heavy == 'true'
        run: npx --yes --package=@dbml/cli@10.3.0 dbml2sql database.dbml --postgres -o /tmp/opendiscogs-schema.sql
